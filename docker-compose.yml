# Информационная система «Грузоперевозки»: запуск всех сервисов одной командой
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gruz
      POSTGRES_USER: gruz
      POSTGRES_PASSWORD: gruz
      TZ: Asia/Yekaterinburg
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gruz -d gruz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      HTTP_ADDR: ":8090"
      DATABASE_URL: postgres://gruz:gruz@postgres:5432/gruz?sslmode=disable
      REDIS_ADDR: redis:6379
      SEED_DEMO: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://backend:8090
    environment:
      API_URL: http://backend:8090
    ports:
      - "3010:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
